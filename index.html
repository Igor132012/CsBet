<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CS2 Bet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#2a231b; color:#f0e6d2; user-select:none;
  }

  :root {
    --bg:      #2a231b;
    --bg2:     #352c22;
    --bg3:     #42382a;
    --border:  #5c4d38;
    --border2: #7a6850;
    --sand:    #d9c49a;
    --text:    #f0e6d2;
    --text2:   #b8a888;
    --text3:   #8a7754;
    --accent:  #d46b4a;
    --gold:    #e0b84a;
    --gold2:   #ffd966;
    --ct:      #4a6b8a;
    --green:   #6fbf4a;
    --danger:  #c44a3a;

    --r-consumer:   #b0c3d9;
    --r-industrial: #5e98d9;
    --r-milspec:    #4b69ff;
    --r-restricted: #8847ff;
    --r-classified: #d32ce6;
    --r-covert:     #eb4b4b;
    --r-rare:       #ffd700;
    --r-contraband: #e4ae39;
    --r-stattrak:   #cf6a32;
  }

  #bg {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(217,196,154,0.1), transparent),
      radial-gradient(ellipse 60% 40% at 20% 100%, rgba(212,107,74,0.06), transparent),
      linear-gradient(180deg, #2a231b 0%, #352c22 100%);
  }

  .sand-dot {
    position:absolute; width:1px; height:1px; background:var(--sand); border-radius:50%;
    opacity:.2; animation:sandFloat 20s infinite linear;
  }
  @keyframes sandFloat {
    0%   { transform:translate(0, 0); opacity:0; }
    10%  { opacity:.3; }
    90%  { opacity:.3; }
    100% { transform:translate(30px, -40px); opacity:0; }
  }

  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column;
    z-index:1; transition:opacity .25s; background:transparent;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .screen.hidden { opacity:0; pointer-events:none; }

  .ico {
    display:inline-block; width:1em; height:1em; vertical-align:-0.12em;
    flex-shrink:0; line-height:1;
  }
  .ico svg { width:100%; height:100%; display:block; }
  .ico img { width:100%; height:100%; object-fit:contain; display:block; }

  /* === МЕНЮ === */
  #menu {
    padding:32px 20px 48px;
    text-align:center;
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
  }
  .brand {
    font-size:12px; color:var(--text3); letter-spacing:8px; text-transform:uppercase;
    margin-bottom:28px; font-weight:600;
  }
  .brand span { color:var(--accent); }
  .balance-block { margin-bottom:28px; }
  .balance-label {
    font-size:10px; color:var(--text3); letter-spacing:4px; text-transform:uppercase;
    margin-bottom:10px;
  }
  .balance-value {
    font-size:52px; font-weight:200; letter-spacing:-2px;
    color:var(--gold2); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .balance-value .ico { font-size:34px; color:var(--gold2); opacity:.9; }

  .modes {
    display:flex; flex-direction:column; gap:12px;
    width:100%; max-width:360px;
  }
  .mode-row {
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  .mode-card {
    border:1px solid var(--border2);
    background:linear-gradient(135deg, rgba(66,56,42,0.9), rgba(53,44,34,0.7));
    border-radius:16px;
    padding:18px;
    color:var(--text); cursor:pointer;
    display:flex; flex-direction:column; justify-content:space-between;
    text-align:left; font-family:inherit;
    transition:border-color .2s, transform .15s, box-shadow .2s;
    position:relative; overflow:hidden;
    min-height:130px;
  }
  .mode-card-big {
    min-height:160px;
    flex-direction:row; align-items:center; gap:14px;
  }
  .mode-card:active {
    border-color:var(--accent);
    transform:scale(0.98);
    box-shadow:0 0 24px rgba(212,107,74,0.25);
  }
  .mode-card::before {
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 70% 30%, rgba(212,107,74,0.12), transparent 60%);
    pointer-events:none;
  }
  .mode-card-content { position:relative; z-index:1; flex:1; }
  .mode-card-big .mode-card-content { flex:0 0 auto; }
  .mode-card-title {
    font-size:20px; font-weight:700; color:var(--sand);
    letter-spacing:1px; margin-bottom:5px;
  }
  .mode-card-desc {
    font-size:11px; color:var(--text3);
    letter-spacing:0.5px;
  }
  .mode-card-icon {
    width:64px; height:52px; color:var(--gold2); opacity:0.85;
    position:relative; z-index:1; align-self:flex-end;
  }
  .mode-card-big .mode-card-icon {
    width:110px; height:80px; align-self:center;
  }
  .mode-card-icon svg { width:100%; height:100%; }

  /* === ТОПБАР === */
  .topbar {
    padding:18px 22px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--border); position:relative; z-index:2;
    flex-shrink: 0;
  }
  .close-btn {
    background:transparent; border:none; color:var(--text3);
    cursor:pointer; padding:8px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .close-btn:active { color:var(--accent); }
  .close-btn .ico { font-size:20px; }
  .topbar-balance {
    color:var(--gold2); font-size:15px; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:6px; font-weight:300;
  }
  .topbar-balance .ico { font-size:14px; color:var(--gold2); }

  /* === КЕЙСЫ === */
  .cases-list {
    flex:1; padding:24px; display:flex; flex-direction:column;
    gap:14px; overflow-y:auto; position:relative; z-index:2;
  }
  .case-item {
    border:1px solid var(--border2); background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:12px;
    padding:22px 24px; color:var(--text); cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s; font-family:inherit; text-align:left;
    position:relative; overflow:hidden;
  }
  .case-item::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg, var(--sand), var(--accent));
    opacity:0.7;
  }
  .case-item:active { border-color:var(--accent); }
  .case-item .info .name { font-size:15px; letter-spacing:1px; font-weight:600; color:var(--sand); }
  .case-item .info .range { color:var(--text3); font-size:11px; margin-top:5px; }
  .case-item .price {
    font-size:15px; color:var(--gold2); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:5px; flex-shrink:0;
  }
  .case-item .price .ico { font-size:14px; }
  .case-item.case-sub { border-color:var(--green); }

  /* === ОТКРЫТИЕ КЕЙСА === */
  #caseOpen { overflow: hidden; }

  .roulette-stage {
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative; overflow:hidden; z-index:2;
    padding:16px 0;
    flex-shrink:0;
  }
  .roulette { position:relative; width:100%; height:120px; overflow:hidden; }
  .roulette::before, .roulette::after {
    content:""; position:absolute; top:0; bottom:0; width:70px; z-index:4;
    pointer-events:none;
  }
  .roulette::before { left:0; background:linear-gradient(to right, var(--bg) 20%, transparent); }
  .roulette::after { right:0; background:linear-gradient(to left, var(--bg) 20%, transparent); }

  .track {
    position:absolute; top:0; left:0; height:100%;
    display:flex; align-items:center; will-change:transform;
  }
  .slot {
    width:100px; height:110px; margin:0 5px; flex-shrink:0;
    border:1px solid var(--border); border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:linear-gradient(180deg, var(--bg3), var(--bg2));
    overflow:hidden; padding:6px;
    position:relative;
  }
  .slot .slot-img {
    width:80px; height:50px; display:flex; align-items:center; justify-content:center;
    color:var(--text3);
  }
  .slot .slot-img svg,
  .slot .slot-img img { width:100%; height:100%; object-fit:contain; }
  .slot .slot-name {
    font-size:8px; text-align:center;
    line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:90px;
  }
  .slot .slot-wear { font-size:7px; opacity:.6; }
  .slot .slot-st {
    position:absolute;
    right:4px; bottom:4px;
    font-size:8px; font-weight:700;
    color:var(--r-stattrak);
    letter-spacing:0.5px;
  }

  .slot.consumer   { border-color:var(--r-consumer); color:var(--r-consumer); }
  .slot.consumer .slot-img { color:var(--r-consumer); }
  .slot.industrial { border-color:var(--r-industrial); color:var(--r-industrial); }
  .slot.industrial .slot-img { color:var(--r-industrial); }
  .slot.milspec    { border-color:var(--r-milspec); color:var(--r-milspec); }
  .slot.milspec .slot-img { color:var(--r-milspec); }
  .slot.restricted { border-color:var(--r-restricted); color:var(--r-restricted); }
  .slot.restricted .slot-img { color:var(--r-restricted); }
  .slot.classified { border-color:var(--r-classified); color:var(--r-classified); }
  .slot.classified .slot-img { color:var(--r-classified); }
  .slot.covert     { border-color:var(--r-covert); color:var(--r-covert); }
  .slot.covert .slot-img { color:var(--r-covert); }
  .slot.rare       { border-color:var(--r-rare); color:var(--r-rare); }
  .slot.rare .slot-img { color:var(--r-rare); }
  .slot.contraband { border-color:var(--r-contraband); color:var(--r-contraband); }
  .slot.contraband .slot-img { color:var(--r-contraband); }

  .pointer {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:2px; height:130px; background:var(--accent); z-index:5;
    border-radius:1px;
  }

  .spin-result {
    text-align:center; margin-top:20px;
    opacity:0; transition:opacity .3s;
    min-height: 40px;
  }
  .spin-result.show { opacity:1; }
  .spin-result .label {
    font-size:9px; color:var(--text3); letter-spacing:4px; text-transform:uppercase;
    margin-bottom:10px;
  }
  .spin-result .val {
    font-size:36px; font-weight:200;
    color:var(--gold2); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }

  /* === СПИСОК ДРОПОВ — СЕТКА КАК НА СКРИНЕ === */
  .case-drops {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 20px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.25);
    position: relative; z-index: 2;
    -webkit-overflow-scrolling: touch;
  }
  .case-drops-title {
    font-size: 9px; color: var(--text3);
    letter-spacing: 4px; text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 4px;
  }
  .case-drops-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .drop-item {
    position: relative;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: linear-gradient(160deg, rgba(66,56,42,0.85), rgba(40,32,22,0.9));
    display: flex; flex-direction: column;
    overflow: hidden;
    aspect-ratio: 1 / 1;
  }
  .drop-item::before {
    content: ""; position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, var(--drop-color, transparent) 0%, transparent 55%);
    opacity: 0.15;
    pointer-events: none;
  }
  .drop-item::after {
    content: ""; position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: var(--drop-color, var(--border2));
  }
  .drop-price-badge {
    position: absolute; top: 8px; left: 8px;
    background: #000;
    color: var(--gold2);
    font-size: 11px; font-weight: 700;
    padding: 3px 7px;
    border-radius: 4px;
    letter-spacing: 0.3px;
    z-index: 2;
  }
  .drop-st {
    position: absolute; top: 8px; right: 8px;
    background: var(--r-stattrak);
    color: #000;
    font-size: 9px; font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    z-index: 2;
  }
  .drop-wear-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(0,0,0,0.7);
    color: var(--sand);
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    z-index: 2;
    font-weight: 600;
  }
  .drop-item .drop-img {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 4px 22px;
  }
  .drop-item .drop-img svg,
  .drop-item .drop-img img {
    width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .drop-item .drop-name {
    font-size: 10px; color: var(--sand);
    line-height: 1.2;
    text-align: left;
    width: 100%;
    padding-right: 26px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: 500;
  }
  .drop-item .drop-skin {
    font-size: 10px; color: var(--text3);
    line-height: 1.2;
    text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .spin-controls {
    padding: 16px 24px 20px;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  .main-btn {
    width:100%; background:linear-gradient(180deg, var(--bg3), var(--bg2)); border:1px solid var(--accent);
    border-radius:12px; padding:20px; color:var(--sand);
    font-size:14px; font-weight:600; letter-spacing:3px;
    cursor:pointer; transition:background .2s, border-color .2s;
    font-family:inherit; text-transform:uppercase;
  }
  .main-btn:active:not(.disabled):not(:disabled) {
    background:linear-gradient(180deg, #4a2a1a, #2a1a10);
  }
  .main-btn:disabled, .main-btn.disabled {
    color:var(--text3) !important;
    border-color:var(--border) !important;
    background:var(--bg2) !important;
    cursor:not-allowed !important;
    pointer-events:none;
  }

  /* === АПГРЕЙДЕР === */
  .upgrade-stage {
    flex:1; display:flex; flex-direction:column;
    padding:24px;
    gap:20px; position:relative; z-index:2;
    overflow-y:auto;
  }

  .upgrade-pair { display:flex; flex-direction:column; gap:14px; }

  .upgrade-side {
    border:1px solid var(--border2); border-radius:12px;
    background:linear-gradient(180deg, var(--bg3), var(--bg2));
    padding:16px 18px;
    cursor:pointer;
    display:flex; align-items:center; gap:14px;
    transition:border-color .2s;
  }
  .upgrade-side:active { border-color:var(--accent); }

  .upgrade-side .thumb {
    width:80px; height:50px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--text3);
  }
  .upgrade-side .thumb svg,
  .upgrade-side .thumb img { width:100%; height:100%; object-fit:contain; }

  .upgrade-side .info { flex:1; min-width:0; }
  .upgrade-side .info .label {
    font-size:9px; color:var(--text3); letter-spacing:2px; text-transform:uppercase;
    margin-bottom:4px;
  }
  .upgrade-side .info .name {
    font-size:13px; color:var(--sand);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .upgrade-side .info .wear { font-size:10px; color:var(--text3); margin-top:3px; }
  .upgrade-side .price {
    font-size:13px; color:var(--gold2); font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }

  .upgrade-circle-wrap {
    position:relative; width:160px; height:160px;
    display:flex; align-items:center; justify-content:center;
    margin:16px auto;
  }
  .upgrade-circle {
    width:150px; height:150px; border-radius:50%;
    border:5px solid var(--border);
    background:conic-gradient(var(--gold2) var(--p, 0%), var(--border) 0%);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition:background .3s;
  }
  .upgrade-circle::before {
    content:""; position:absolute; inset:8px; border-radius:50%;
    background:var(--bg2); z-index:1;
  }
  .upgrade-percent {
    position:relative; z-index:2;
    font-size:34px; font-weight:200; color:var(--gold2);
    font-variant-numeric:tabular-nums;
  }
  .upgrade-percent span { font-size:20px; }

  .upgrade-arrow-indicator {
    position:absolute; top:-8px; left:50%;
    transform:translateX(-50%) rotate(0deg);
    transform-origin:50% 88px;
    z-index:5;
    filter:drop-shadow(0 0 6px var(--gold2));
    transition:transform 2.8s cubic-bezier(0.15, 0.7, 0.15, 1);
  }
  .upgrade-arrow-indicator svg { width:22px; height:26px; }

  .upgrade-chance {
    text-align:center; font-size:12px; color:var(--text3);
    letter-spacing:2px; margin:12px 0;
  }
  .upgrade-chance span { color:var(--accent); font-weight:600; }

  .upgrade-controls { margin-top:auto; padding-top:12px; }

  /* === ИНВЕНТАРЬ === */
  .inv-list { flex:1; padding:24px; overflow-y:auto; position:relative; z-index:2; }
  .inv-item {
    display:flex; align-items:center; gap:14px;
    padding:16px 18px; border:1px solid var(--border);
    border-radius:12px; margin-bottom:12px; background:var(--bg2);
  }
  .inv-item .inv-img {
    width:70px; height:44px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .inv-item .inv-img svg,
  .inv-item .inv-img img { width:100%; height:100%; object-fit:contain; }
  .inv-item .inv-info { flex:1; min-width:0; }
  .inv-item .inv-price {
    font-size:14px; color:var(--gold2);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .inv-item .inv-name { font-size:13px; color:var(--sand); font-weight: 500; }
  .inv-item .inv-wear { font-size:10px; color:var(--text3); margin-top:3px; }
  .inv-item .sell-btn {
    background:transparent; border:1px solid var(--accent);
    border-radius:6px; color:var(--sand);
    font-size:10px; padding:6px 12px;
    font-family:inherit; cursor:pointer;
    white-space: nowrap;
  }
  .inv-item .sell-btn:active { background:#4a2a1a; }
  .inv-empty { text-align:center; color:var(--text3); padding:60px 20px; font-size:13px; }

  /* === ПРОФИЛЬ === */
  .profile-content { flex:1; padding:24px; overflow-y:auto; position:relative; z-index:2; }
  .profile-card {
    border:1px solid var(--border2);
    background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:14px; padding:22px; margin-bottom:20px;
    display:flex; align-items:center; gap:16px;
  }
  .profile-avatar {
    width:60px; height:60px; border-radius:50%;
    border:1px solid var(--border2); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--sand); background:var(--bg);
    overflow:hidden;
  }
  .profile-avatar img { width:100%; height:100%; object-fit:cover; }
  .profile-avatar .ico { font-size:28px; }
  .profile-info .name { font-size:17px; font-weight:500; color:var(--sand); }
  .profile-info .username { color:var(--text3); font-size:13px; margin-top:4px; }

  .stat-card {
    border:1px solid var(--border); background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:12px; padding:20px 14px; text-align:center;
    margin-bottom:20px;
  }
  .stat-card .stat-label {
    font-size:9px; color:var(--text3); letter-spacing:2px; text-transform:uppercase;
    margin-bottom:8px;
  }
  .stat-card .stat-value {
    font-size:24px; font-weight:300; color:var(--sand);
    font-variant-numeric:tabular-nums;
  }

  .section-label {
    font-size: 9px; color: var(--text3);
    letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 10px; margin-top: 4px;
  }
  .best-win {
    border: 1px solid var(--border2);
    background: linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
    text-align: center;
  }
  .best-win-empty {
    color: var(--text3); font-size: 13px; padding: 20px 0;
  }
  .best-win-img {
    width: 100px; height: 70px; margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .best-win-img svg,
  .best-win-img img { width: 100%; height: 100%; object-fit: contain; }

<script>
/* ==================== TELEGRAM ==================== */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ==================== КАРТИНКИ ==================== */
const IMG_RIFLE = "rifle.png";
const IMG_KNIFE = "knife.png";
const IMG_SNIPER = "sniper_rifle.png";
const IMG_GUN = "gun.png";

function weaponImg(weaponType) {
  if (weaponType === 'knife')   return `<img src="${IMG_KNIFE}" alt="">`;
  if (weaponType === 'sniper')  return `<img src="${IMG_SNIPER}" alt="">`;
  if (weaponType === 'pistol')  return `<img src="${IMG_GUN}" alt="">`;
  return `<img src="${IMG_RIFLE}" alt="">`;
}

/* ==================== SVG ИКОНКИ ==================== */
const ICONS = {
  ruble: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4h5a5 5 0 0 1 0 10H6"/><path d="M6 14h8"/><path d="M6 18h6"/></svg>`,
  gift: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M3 12h18M12 8v13"/><path d="M12 8c-2 0-4-1-4-3s2-2 4 3c2-5 4-5 4-3s-2 3-4 3z"/></svg>`,
  user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>`,
  close: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 L18 18M18 6 L6 18"/></svg>`,
};

function renderIcons(root = document) {
  root.querySelectorAll('.ico[data-icon]').forEach(el => {
    const key = el.dataset.icon;
    if (ICONS[key]) el.innerHTML = ICONS[key];
  });
}

/* ==================== СОСТОЯНИЕ ==================== */
const state = {
  balance: 1000,
  inventory: [],
  currentCase: null,
  isSpinning: false,
  upgrade: { fromSkin: null, toSkin: null, chance: 0 },
};

const $ = id => document.getElementById(id);

/* ==================== ФОН ==================== */
(function makeSand(){
  const box = $('bg');
  for (let i = 0; i < 25; i++) {
    const d = document.createElement('div');
    d.className = 'sand-dot';
    d.style.left = Math.random() * 100 + '%';
    d.style.top = Math.random() * 100 + '%';
    d.style.animationDelay = (Math.random() * 20) + 's';
    box.appendChild(d);
  }
})();

/* ==================== UI ==================== */
function fmt(n) { return Math.floor(n).toLocaleString('ru-RU'); }
function rubIco() { return `<span class="ico" data-icon="ruble">${ICONS.ruble}</span>`; }

function updateBalance() {
  $('menuBalance').innerHTML = `${rubIco()}<span class="num">${fmt(state.balance)}</span>`;
  $('casesBalance').textContent = fmt(state.balance);
  $('openBalance').textContent = fmt(state.balance);
  $('upgradeBalance').textContent = fmt(state.balance);
  $('inventoryBalance').textContent = fmt(state.balance);
  $('profileBalance').textContent = fmt(state.balance);
  $('statSkins').textContent = fmt(state.inventory.reduce((s, sk) => s + sk.price, 0));
  updateBestWin();
}

function updateBestWin() {
  const box = $('bestWin');
  if (!box) return;
  if (!state.inventory.length) {
    box.innerHTML = '<div class="best-win-empty">Пока нет выигрышей</div>';
    return;
  }
  const best = state.inventory.reduce((a, b) => a.price > b.price ? a : b);
  box.innerHTML = `
    <div class="best-win-img">${weaponImg(best.weapon)}</div>
    <div class="best-win-name">${best.name}</div>
    <div class="best-win-wear">${best.wearName}${best.statTrak ? ' · StatTrak™' : ''}</div>
    <div class="best-win-price">${fmt(best.price)} ₽</div>
  `;
}

function toastText(msg, kind) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => {
    t.classList.remove('win', 'lose');
    t.classList.remove('show');
  }, 2000);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
}

/* ==================== БАЛАНС ==================== */
function canAfford(amount) {
  return state.balance >= amount;
}

function spend(amount) {
  if (!canAfford(amount)) return false;
  state.balance -= amount;
  updateBalance();
  return true;
}

function earn(amount) {
  state.balance += amount;
  updateBalance();
}

/* ==================== КАТАЛОГ ==================== */
const ALL_SKINS = [
  { id:'ak_redline',    name:'AK-47 | Красная линия',    weapon:'rifle',  rarity:'classified', basePrice:4200,  hasStatTrak:true },
  { id:'ak_vulcan',     name:'AK-47 | Вулкан',           weapon:'rifle',  rarity:'covert',     basePrice:9800,  hasStatTrak:true },
  { id:'ak_asiimov',    name:'AK-47 | Азимов',           weapon:'rifle',  rarity:'covert',     basePrice:3200,  hasStatTrak:true },
  { id:'ak_nightwish',  name:'AK-47 | Пожелание на ночь',weapon:'rifle',  rarity:'covert',     basePrice:4600,  hasStatTrak:true },
  { id:'ak_fire_serp',  name:'AK-47 | Огненный змей',    weapon:'rifle',  rarity:'covert',     basePrice:28000, hasStatTrak:true },
  { id:'m4a4_howl',     name:'M4A4 | Вой',               weapon:'rifle',  rarity:'contraband', basePrice:380000, hasStatTrak:false },
  { id:'m4a4_asiimov',  name:'M4A4 | Азимов',            weapon:'rifle',  rarity:'covert',     basePrice:5100,  hasStatTrak:true },
  { id:'m4a1s_print',   name:'M4A1-S | Поток информации', weapon:'rifle',  rarity:'covert',     basePrice:2600,  hasStatTrak:true },
  { id:'m4a4_temukau',  name:'M4A4 | Темукау',           weapon:'rifle',  rarity:'covert',     basePrice:1900,  hasStatTrak:true },
  { id:'m4a1s_solitude',name:'M4A1-S | Одиночество',     weapon:'rifle',  rarity:'classified', basePrice:1100,  hasStatTrak:true },
  { id:'m4a4_desolate', name:'M4A4 | Пустынное пространство', weapon:'rifle', rarity:'milspec',  basePrice:180,   hasStatTrak:true },
  { id:'ak_slate',      name:'AK-47 | Шифер',            weapon:'rifle',  rarity:'milspec',    basePrice:95,    hasStatTrak:true },
  { id:'galil_ar',      name:'Galil AR | Пустынный воин',weapon:'rifle',  rarity:'industrial', basePrice:45,    hasStatTrak:true },

  { id:'awp_dragon',    name:'AWP | Драконий огонь',     weapon:'sniper', rarity:'covert',     basePrice:420000, hasStatTrak:true },
  { id:'awp_asiimov',   name:'AWP | Азимов',             weapon:'sniper', rarity:'covert',     basePrice:6800,  hasStatTrak:true },

const WEARS = [
  { key:'FN', name:'Прямо с завода',        mult:1.00 },
  { key:'MW', name:'Немного поношенное',     mult:0.65 },
  { key:'FT', name:'После полевых испытаний', mult:0.40 },
  { key:'WW', name:'Поношенное',             mult:0.30 },
  { key:'BS', name:'Закалённое в боях',      mult:0.22 },
];

function randomWear() {
  const r = Math.random();
  if (r < 0.03) return WEARS[0];
  if (r < 0.10) return WEARS[1];
  if (r < 0.45) return WEARS[2];
  if (r < 0.55) return WEARS[3];
  return WEARS[4];
}

function createSkinInstance(skinDef) {
  const wear = randomWear();
  const statTrak = skinDef.hasStatTrak && Math.random() < 0.10;
  let price = Math.round(skinDef.basePrice * wear.mult);
  if (statTrak) price = Math.round(price * 1.35);
  return {
    id: skinDef.id + '_' + wear.key + (statTrak ? '_st' : '') + '_' + Date.now() + '_' + Math.random(),
    skinId: skinDef.id,
    name: skinDef.name,
    weapon: skinDef.weapon,
    rarity: skinDef.rarity,
    wear: wear.key,
    wearName: wear.name,
    statTrak: statTrak,
    price: price,
  };
}

/* ==================== РЕДКОСТИ ==================== */
const RARITY_WEIGHTS = {
  consumer:   60,
  industrial: 25,
  milspec:    11,
  restricted: 3,
  classified: 0.7,
  covert:     0.25,
  rare:       0.05,
  contraband: 0.005,
};

const RARITY_COLORS = {
  consumer:   'var(--r-consumer)',
  industrial: 'var(--r-industrial)',
  milspec:    'var(--r-milspec)',
  restricted: 'var(--r-restricted)',
  classified: 'var(--r-classified)',
  covert:     'var(--r-covert)',
  rare:       'var(--r-rare)',
  contraband: 'var(--r-contraband)',
};

function pickSkinFromPool(pool) {
  const available = {};
  pool.forEach(s => { available[s.rarity] = (available[s.rarity] || 0) + 1; });
  let total = 0;
  const weighted = {};
  for (const r in RARITY_WEIGHTS) {
    if (available[r]) {
      weighted[r] = RARITY_WEIGHTS[r];
      total += RARITY_WEIGHTS[r];
    }
  }
  let roll = Math.random() * total;
  for (const r in weighted) {
    roll -= weighted[r];
    if (roll <= 0) {
      const poolOfRarity = pool.filter(s => s.rarity === r);
      return poolOfRarity[Math.floor(Math.random() * poolOfRarity.length)];
    }
  }
  return pool[0];
}

/* ==================== КЕЙСЫ: idle ==================== */
let idleRaf = null;

function stopIdleSpin() {
  if (idleRaf) {
    cancelAnimationFrame(idleRaf);
    idleRaf = null;
  }
}

function startIdleSpin() {
  stopIdleSpin();
  const track = $('track');
  track.style.transition = 'none';

  let pos = 0;
  let last = performance.now();

  function frame(now) {
    const dt = now - last;
    last = now;
    pos -= dt * 0.03;
    if (pos < -60 * 110) pos += 60 * 110;
    track.style.transform = `translateX(${pos}px)`;
    idleRaf = requestAnimationFrame(frame);
  }
  idleRaf = requestAnimationFrame(frame);
}

function openCaseScreen(caseKey) {
  const caseDef = CASES[caseKey];
  if (caseDef && !canAfford(caseDef.price)) {
    toastText('Недостаточно средств', 'lose');
    return;
  }

  state.currentCase = caseKey;
  showScreen('caseOpen');
  updateBalance();
  $('spinBtn').textContent = 'Открыть';
  $('spinBtn').disabled = false;
  $('spinBtn').classList.remove('disabled');
  $('spinResult').className = 'spin-result';
  fillTrack();
  renderCaseDrops();
}

function fillTrack() {
  stopIdleSpin();
  const track = $('track');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  const pool = getPoolForCurrentCase();
  for (let i = 0; i < 60; i++) {
    const skinDef = pool[Math.floor(Math.random() * pool.length)];
    track.appendChild(makeSlot(skinDef, false));
  }
  startIdleSpin();
}

function getPoolForCurrentCase() {
  if (state.currentCase === 'subcase') {
    return ALL_SKINS.filter(s => ['consumer', 'industrial', 'milspec'].includes(s.rarity));
  }
  const caseDef = CASES[state.currentCase];
  return ALL_SKINS.filter(s => caseDef.pool.includes(s.id));
}

function makeSlot(skinDef, statTrak) {
  const el = document.createElement('div');
  el.className = 'slot ' + skinDef.rarity;
  el.innerHTML = `
    <div class="slot-img">${weaponImg(skinDef.weapon)}</div>
    <div class="slot-name">${skinDef.name.split('|')[0].trim()}</div>
    <div class="slot-wear">${skinDef.name.split('|')[1]?.trim() || ''}</div>
    ${statTrak ? '<div class="slot-st">ST</div>' : ''}
  `;
  return el;
}

/* ==================== СПИСОК ДРОПОВ ==================== */
function renderCaseDrops() {
  const list = $('caseDropsList');
  if (!list) return;
  list.innerHTML = '';
  const pool = getPoolForCurrentCase();

  const totalWeight = pool.reduce((s, def) => s + (RARITY_WEIGHTS[def.rarity] || 1), 0);

  const drops = [];
  pool.forEach(def => {
    WEARS.forEach(wear => {
      const price = Math.round(def.basePrice * wear.mult);
      const chance = (RARITY_WEIGHTS[def.rarity] || 1) / totalWeight * 100;
      drops.push({ def, wear, price, chance, statTrak: false });
      if (def.hasStatTrak) {
        drops.push({
          def, wear,
          price: Math.round(price * 1.35),
          chance: chance * 0.1,
          statTrak: true
        });
      }
    });
  });

  drops.sort((a, b) => a.price - b.price);

  drops.forEach(d => {
    // Разбираем название: "AK-47 | Красная линия" → оружие и скин
    const parts = d.def.name.split('|');
    const weaponName = parts[0].trim();
    const skinName = parts[1] ? parts[1].trim() : '';

    const el = document.createElement('div');
    el.className = 'drop-item';
    el.style.setProperty('--drop-color', RARITY_COLORS[d.def.rarity] || 'var(--border2)');
    el.innerHTML = `
      <div class="drop-price-badge">${fmt(d.price)} ₽</div>
      ${d.statTrak ? '<div class="drop-st">ST</div>' : ''}
      <div class="drop-wear-badge">${d.wear.key}</div>
      <div class="drop-img">${weaponImg(d.def.weapon)}</div>
      <div class="drop-name">${weaponName}</div>
      <div class="drop-skin">${skinName}${d.statTrak ? ' ST' : ''}</div>
    `;
    list.appendChild(el);
  });
}

function mainCaseAction() {
  if (state.isSpinning) return;

  const caseDef = CASES[state.currentCase];
  const isFree = state.currentCase === 'subcase';

  if (!isFree && caseDef) {
    if (!canAfford(caseDef.price)) {
      toastText('Недостаточно средств', 'lose');
      return;
    }
    if (!spend(caseDef.price)) return;
    toastText(`−${fmt(caseDef.price)} ₽`, 'lose');
  }

  state.isSpinning = true;

  const btn = $('spinBtn');
  btn.disabled = true;
  btn.classList.add('disabled');
  btn.textContent = 'Крутим...';
  $('spinResult').className = 'spin-result';

  stopIdleSpin();

  const track = $('track');
  const pool = getPoolForCurrentCase();
  const winSkinDef = pickSkinFromPool(pool);
  const winSkin = createSkinInstance(winSkinDef);

  track.innerHTML = '';
  const STOP_INDEX = 50;
  for (let i = 0; i < 60; i++) {
    let skinDef, isST = false;
    if (i === STOP_INDEX) {
      skinDef = winSkinDef;
      isST = winSkin.statTrak;
    } else {
      skinDef = pool[Math.floor(Math.random() * pool.length)];
    }
    track.appendChild(makeSlot(skinDef, isST));
  }

  void track.offsetWidth;

  const wrap = track.parentElement;
  const wrapW = wrap.clientWidth;
  const targetSlot = track.children[STOP_INDEX];
  const trackRect = track.getBoundingClientRect();
  const slotRect = targetSlot.getBoundingClientRect();
  const slotCenter = (slotRect.left - trackRect.left) + slotRect.width / 2;
  const targetX = wrapW / 2 - slotCenter;

  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  void track.offsetWidth;

  const duration = 4500;
  track.style.transition = `transform ${duration}ms cubic-bezier(0.12, 0.85, 0.18, 1)`;
  track.style.transform = `translateX(${targetX}px)`;

  setTimeout(() => {
    state.isSpinning = false;
    btn.disabled = false;
    btn.classList.remove('disabled');
    btn.textContent = 'Открыть';
    $('spinValue').innerHTML = `${rubIco()} ${winSkin.price}`;
    $('spinResult').className = 'spin-result show';

    state.inventory.push(winSkin);
    toastText(`Получено: ${winSkin.name}`, 'win');
    updateBalance();
  }, duration + 100);
}

let modalCandidates = [];

function pickToTarget() {
  const from = state.upgrade.fromSkin;
  if (!from) { toastText('Сначала выбери свой скин', 'lose'); return; }

  modalCandidates = [];
  ALL_SKINS.forEach(def => {
    if (def.basePrice <= from.price) return;
    WEARS.forEach(wear => {
      const instance = {
        id: def.id + '_' + wear.key,
        skinId: def.id,
        name: def.name,
        weapon: def.weapon,
        rarity: def.rarity,
        wear: wear.key,
        wearName: wear.name,
        statTrak: false,
        price: Math.round(def.basePrice * wear.mult),
      };
      if (instance.price > from.price) {
        modalCandidates.push({ def, instance });
      }
      if (def.hasStatTrak) {
        const stInstance = {
          id: def.id + '_' + wear.key + '_st',
          skinId: def.id,
          name: def.name,
          weapon: def.weapon,
          rarity: def.rarity,
          wear: wear.key,
          wearName: wear.name,
          statTrak: true,
          price: Math.round(def.basePrice * wear.mult * 1.35),
        };
        if (stInstance.price > from.price) {
          modalCandidates.push({ def, instance: stInstance });
        }
      }
    });
  });

  modalCandidates.sort((a, b) => a.instance.price - b.instance.price);

  $('modalTitle').textContent = 'Выбери целевой скин';
  $('modalSearch').style.display = 'block';
  $('modalSearch').value = '';
  document.querySelector('.modal-filters').style.display = 'flex';
  $('modalMinPrice').value = '';
  $('modalMaxPrice').value = '';
  $('modalSort').value = 'asc';

  filterModalList();
  $('modalOverlay').classList.add('show');
}

function filterModalList() {
  const q = ($('modalSearch').value || '').toLowerCase().trim();
  const min = parseInt($('modalMinPrice').value) || 0;
  const max = parseInt($('modalMaxPrice').value) || Infinity;
  const sort = $('modalSort').value;

  let list = modalCandidates.filter(c => {
    const nameOk = !q || c.def.name.toLowerCase().includes(q);
    const priceOk = c.instance.price >= min && c.instance.price <= max;
    return nameOk && priceOk;
  });

  list.sort((a, b) => sort === 'asc' ? a.instance.price - b.instance.price : b.instance.price - a.instance.price);

  const box = $('modalList');
  box.innerHTML = '';

  if (!list.length) {
    box.innerHTML = '<div class="modal-empty">Ничего не найдено</div>';
    return;
  }

  list.slice(0, 100).forEach(c => {
    const item = document.createElement('div');
    item.className = 'modal-item';
    item.innerHTML = `
      <div class="mi-img">${weaponImg(c.def.weapon)}</div>
      <div class="mi-info">
        <div class="mi-name">${c.def.name}${c.instance.statTrak ? ' · StatTrak™' : ''}</div>
        <div class="mi-wear">${c.instance.wearName}</div>
      </div>
      <div class="mi-price">${fmt(c.instance.price)} ₽</div>
    `;
    item.onclick = () => {
      state.upgrade.toSkin = c.instance;
      $('upToPreview').innerHTML = weaponImg(c.instance.weapon);
      $('upToName').textContent = c.instance.name;
      $('upToWear').textContent = c.instance.wearName + (c.instance.statTrak ? ' · ST' : '');
      $('upToPrice').textContent = c.instance.price + ' ₽';
      updateUpgradeChance();
      closeModal();
    };
    box.appendChild(item);
  });
}

function closeModal(e) {
  if (e && e.target !== $('modalOverlay')) return;
  $('modalOverlay').classList.remove('show');
}

function updateUpgradeChance() {
  const from = state.upgrade.fromSkin;
  const to = state.upgrade.toSkin;

  if (!from || !to) {
    state.upgrade.chance = 0;
    $('upChance').textContent = '0%';
    $('upgradePercent').textContent = '?%';
    $('upgradeCircle').style.setProperty('--p', '0%');
    return;
  }

  let chance = (from.price / to.price) * 100;
  chance = Math.min(chance, 90);
  chance = Math.max(chance, 1);
  state.upgrade.chance = Math.round(chance);

  $('upChance').textContent = state.upgrade.chance + '%';
  $('upgradePercent').innerHTML = state.upgrade.chance + '<span>%</span>';
  $('upgradeCircle').style.setProperty('--p', state.upgrade.chance + '%');
}

function doUpgrade() {
  if (!state.upgrade.fromSkin || !state.upgrade.toSkin) {
    toastText('Выбери оба скина', 'lose');
    return;
  }
  if (state.isSpinning) return;
  state.isSpinning = true;

  const btn = $('upgradeBtn');
  btn.disabled = true;
  btn.classList.add('disabled');
  btn.textContent = 'Крутим...';

  const arrow = $('upgradeArrow');
  const success = Math.random() * 100 < state.upgrade.chance;
  const chance = state.upgrade.chance;

  let finalAngle;
  const extraSpins = 3;

  if (success) {
    const zoneEnd = (chance / 100) * 360;
    finalAngle = 360 * extraSpins + Math.random() * zoneEnd * 0.9;
  } else {
    const zoneEnd = (chance / 100) * 360;
    const mode = Math.random() < 0.5 ? 'over' : 'under';
    if (mode === 'over') {
      finalAngle = 360 * extraSpins + zoneEnd + 5 + Math.random() * 40;
    } else {
      finalAngle = 360 * (extraSpins - 1) + 360 - (2 + Math.random() * 8);
    }
  }

  arrow.style.transition = 'none';
  arrow.style.transform = `translateX(-50%) rotate(0deg)`;
  void arrow.offsetWidth;

  arrow.style.transition = `transform 2.8s cubic-bezier(0.15, 0.7, 0.15, 1)`;
  arrow.style.transform = `translateX(-50%) rotate(${finalAngle}deg)`;

  setTimeout(() => {
    state.isSpinning = false;
    btn.disabled = false;
    btn.classList.remove('disabled');
    btn.textContent = 'Прокачать';

    const idx = state.inventory.findIndex(s => s.id === state.upgrade.fromSkin.id);
    if (idx >= 0) state.inventory.splice(idx, 1);

    if (success) {
      state.inventory.push(state.upgrade.toSkin);
      toastText(`Успешно: ${state.upgrade.toSkin.name}`, 'win');
    } else {
      toastText('Провал', 'lose');
    }

    state.upgrade.fromSkin = null;
    state.upgrade.toSkin = null;
    $('upFromPreview').innerHTML = '';
    $('upFromName').textContent = 'Выбрать из инвентаря';
    $('upFromWear').textContent = '—';
    $('upFromPrice').textContent = '0 ₽';
    $('upToPreview').innerHTML = '';
    $('upToName').textContent = 'Нажми, чтобы выбрать';
    $('upToWear').textContent = '—';
    $('upToPrice').textContent = '0 ₽';
    updateUpgradeChance();

    updateBalance();
  }, 2900);
}

/* ==================== ИНВЕНТАРЬ ==================== */
function renderInventory() {
  const list = $('invList');
  if (!state.inventory.length) {
    list.innerHTML = '<div class="inv-empty">Инвентарь пуст.<br>Открой кейс, чтобы получить скины.</div>';
    return;
  }
  list.innerHTML = '';
  state.inventory.forEach((skin, idx) => {
    const el = document.createElement('div');
    el.className = 'inv-item';
    el.innerHTML = `
      <div class="inv-img">${weaponImg(skin.weapon)}</div>
      <div class="inv-info">
        <div class="inv-price">${fmt(skin.price)} ₽</div>
        <div class="inv-name">${skin.name}${skin.statTrak ? ' · StatTrak™' : ''}</div>
        <div class="inv-wear">${skin.wearName}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button class="sell-btn" onclick="sellSkin(${idx})">Продать</button>
        <button class="sell-btn" onclick="withdrawSkin(${idx})">Вывод</button>
      </div>
    `;
    list.appendChild(el);
  });
}

function sellSkin(idx) {
  const skin = state.inventory[idx];
  if (!skin) return;
  const price = Math.round(skin.price * 0.9);
  earn(price);
  state.inventory.splice(idx, 1);
  toastText(`+${fmt(price)} ₽`, 'win');
  renderInventory();
  updateBalance();
}

function withdrawSkin(idx) {
  toastText('Заявка отправлена', 'win');
}

/* ==================== ПРОМОКОД / ВЫВОД ==================== */
function applyPromo() {
  const code = $('promoInput').value.trim();
  if (!code) { toastText('Введи код', 'lose'); return; }
  toastText('Промокод скоро будет доступен', 'lose');
}

function withdrawOpen() {
  toastText('Вывод скоро будет доступен', 'lose');
}

/* ==================== INIT ==================== */
renderIcons();
updateBalance();
</script>
</body>
</html>
