<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CS2 Bet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#2a231b; color:#f0e6d2; user-select:none;
  }

  :root {
    --bg:      #2a231b;
    --bg2:     #352c22;
    --bg3:     #42382a;
    --border:  #5c4d38;
    --border2: #7a6850;
    --sand:    #d9c49a;
    --text:    #f0e6d2;
    --text2:   #b8a888;
    --text3:   #8a7754;
    --accent:  #d46b4a;
    --gold:    #e0b84a;
    --gold2:   #ffd966;
    --ct:      #4a6b8a;
    --green:   #6fbf4a;

    --r-consumer:   #b0c3d9;
    --r-industrial: #5e98d9;
    --r-milspec:    #4b69ff;
    --r-restricted: #8847ff;
    --r-classified: #d32ce6;
    --r-covert:     #eb4b4b;
    --r-rare:       #ffd700;
    --r-contraband: #e4ae39;
    --r-stattrak:   #cf6a32;
  }

  #bg {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(217,196,154,0.1), transparent),
      radial-gradient(ellipse 60% 40% at 20% 100%, rgba(212,107,74,0.06), transparent),
      linear-gradient(180deg, #2a231b 0%, #352c22 100%);
  }

  .sand-dot {
    position:absolute; width:1px; height:1px; background:var(--sand); border-radius:50%;
    opacity:.2; animation:sandFloat 20s infinite linear;
  }
  @keyframes sandFloat {
    0%   { transform:translate(0, 0); opacity:0; }
    10%  { opacity:.3; }
    90%  { opacity:.3; }
    100% { transform:translate(30px, -40px); opacity:0; }
  }

  .decor-crates {
    position:fixed; bottom:0; left:0; right:0; height:70px;
    display:flex; justify-content:space-around; align-items:flex-end;
    padding:0 8px; pointer-events:none; z-index:0; opacity:0.35;
  }
  .crate {
    width:55px; height:45px;
    background:linear-gradient(180deg, #4a3d28, #2a231b);
    border:1px solid #5c4d38;
    position:relative;
  }
  .crate::before { content:""; position:absolute; inset:5px; border:1px solid #7a6850; }
  .crate.small { width:36px; height:32px; }

  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column;
    z-index:1; transition:opacity .25s; background:transparent;
  }
  .screen.hidden { opacity:0; pointer-events:none; }

  .ico {
    display:inline-block; width:1em; height:1em; vertical-align:-0.12em;
    flex-shrink:0; line-height:1;
  }
  .ico svg { width:100%; height:100%; display:block; }
  .ico img { width:100%; height:100%; object-fit:contain; display:block; }

  #menu { align-items:center; justify-content:center; padding:28px; text-align:center; position:relative; z-index:2; }
  .brand {
    font-size:12px; color:var(--text3); letter-spacing:8px; text-transform:uppercase;
    margin-bottom:36px; font-weight:600;
  }
  .brand span { color:var(--accent); }
  .balance-block { margin-bottom:36px; }
  .balance-label {
    font-size:10px; color:var(--text3); letter-spacing:4px; text-transform:uppercase;
    margin-bottom:10px;
  }
  .balance-value {
    font-size:52px; font-weight:200; letter-spacing:-2px;
    color:var(--gold2); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .balance-value .ico { font-size:36px; color:var(--gold2); opacity:.9; }

  .modes { display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; }
  .mode-btn {
    border:1px solid var(--border2); background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:12px;
    padding:20px 24px; color:var(--text); cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s, box-shadow .2s;
    font-family:inherit; font-size:15px; letter-spacing:1px;
    position:relative; overflow:hidden;
  }
  .mode-btn::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg, var(--accent), var(--gold));
    opacity:.6;
  }
  .mode-btn:active { border-color:var(--accent); }
  .mode-btn .label { font-weight:600; color:var(--sand); position:relative; }
  .mode-btn .sub { color:var(--text3); font-size:11px; margin-top:4px; letter-spacing:0; position:relative; }
  .mode-btn .arrow { color:var(--text3); font-size:18px; position:relative; }

  .menu-footer { margin-top:32px; display:flex; gap:10px; }
  .mini-btn {
    background:transparent; border:1px solid var(--border); color:var(--text3);
    font-size:12px; letter-spacing:1.5px; cursor:pointer;
    font-family:inherit; padding:12px 22px; border-radius:8px;
  }
  .mini-btn:active { border-color:var(--border2); color:var(--text2); }

  .topbar {
    padding:16px 20px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--border); position:relative; z-index:2;
  }
  .close-btn {
    background:transparent; border:none; color:var(--text3);
    cursor:pointer; padding:8px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .close-btn:active { color:var(--accent); }
  .close-btn .ico { font-size:20px; }
  .topbar-balance {
    color:var(--gold2); font-size:15px; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:6px; font-weight:300;
  }
  .topbar-balance .ico { font-size:14px; color:var(--gold2); }

  .cases-list {
    flex:1; padding:16px 20px; display:flex; flex-direction:column;
    gap:10px; overflow-y:auto; position:relative; z-index:2;
  }
  .case-item {
    border:1px solid var(--border2); background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:10px;
    padding:18px 20px; color:var(--text); cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s; font-family:inherit; text-align:left;
    position:relative; overflow:hidden;
  }
  .case-item::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg, var(--sand), var(--accent));
    opacity:0.7;
  }
  .case-item:active { border-color:var(--accent); }
  .case-item .info .name { font-size:15px; letter-spacing:1px; font-weight:600; color:var(--sand); }
  .case-item .info .range { color:var(--text3); font-size:11px; margin-top:4px; }
  .case-item .price {
    font-size:15px; color:var(--gold2); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:5px; flex-shrink:0;
  }
  .case-item .price .ico { font-size:14px; }
  .case-item.case-sub { border-color:var(--green); }

  .roulette-stage {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative; overflow:hidden; z-index:2;
  }
  .roulette { position:relative; width:100%; height:120px; overflow:hidden; }
  .roulette::before, .roulette::after {
    content:""; position:absolute; top:0; bottom:0; width:70px; z-index:4;
    pointer-events:none;
  }
  .roulette::before { left:0; background:linear-gradient(to right, var(--bg) 20%, transparent); }
  .roulette::after { right:0; background:linear-gradient(to left, var(--bg) 20%, transparent); }

  .track {
    position:absolute; top:0; left:0; height:100%;
    display:flex; align-items:center; will-change:transform;
  }
  .slot {
    width:100px; height:110px; margin:0 4px; flex-shrink:0;
    border:1px solid var(--border); border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:linear-gradient(180deg, var(--bg3), var(--bg2));
    overflow:hidden; padding:6px;
  }
  .slot .slot-img {
    width:80px; height:50px; display:flex; align-items:center; justify-content:center;
    color:var(--text3);
  }
  .slot .slot-img svg,
  .slot .slot-img img { width:100%; height:100%; object-fit:contain; }
  .slot .slot-name {
    font-size:8px; text-align:center;
    line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:90px;
  }
  .slot .slot-wear { font-size:7px; opacity:.6; }
  .slot .slot-stattrak { font-size:7px; color:var(--r-stattrak); font-weight:600; }

  .slot.consumer   { border-color:var(--r-consumer); color:var(--r-consumer); }
  .slot.consumer .slot-img { color:var(--r-consumer); }
  .slot.industrial { border-color:var(--r-industrial); color:var(--r-industrial); }
  .slot.industrial .slot-img { color:var(--r-industrial); }
  .slot.milspec    { border-color:var(--r-milspec); color:var(--r-milspec); }
  .slot.milspec .slot-img { color:var(--r-milspec); }
  .slot.restricted { border-color:var(--r-restricted); color:var(--r-restricted); }
  .slot.restricted .slot-img { color:var(--r-restricted); }
  .slot.classified { border-color:var(--r-classified); color:var(--r-classified); }
  .slot.classified .slot-img { color:var(--r-classified); }
  .slot.covert     { border-color:var(--r-covert); color:var(--r-covert); }
  .slot.covert .slot-img { color:var(--r-covert); }
  .slot.rare       { border-color:var(--r-rare); color:var(--r-rare); }
  .slot.rare .slot-img { color:var(--r-rare); }
  .slot.contraband { border-color:var(--r-contraband); color:var(--r-contraband); }
  .slot.contraband .slot-img { color:var(--r-contraband); }

  .pointer {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:2px; height:130px; background:var(--accent); z-index:5;
    border-radius:1px;
  }

  .spin-result {
    text-align:center; margin-top:20px;
    opacity:0; transition:opacity .3s;
  }
  .spin-result.show { opacity:1; }
  .spin-result .label {
    font-size:9px; color:var(--text3); letter-spacing:4px; text-transform:uppercase;
    margin-bottom:8px;
  }
  .spin-result .val {
    font-size:34px; font-weight:200;
    color:var(--gold2); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }

  .spin-controls { padding:0 20px 20px; position:relative; z-index:2; }

  .main-btn {
    width:100%; background:linear-gradient(180deg, var(--bg3), var(--bg2)); border:1px solid var(--accent);
    border-radius:10px; padding:18px; color:var(--sand);
    font-size:14px; font-weight:600; letter-spacing:3px;
    cursor:pointer; transition:background .2s, border-color .2s;
    font-family:inherit; text-transform:uppercase;
  }
  .main-btn:active:not(.disabled):not(:disabled) {
    background:linear-gradient(180deg, #4a2a1a, #2a1a10);
  }
  .main-btn:disabled, .main-btn.disabled {
    color:var(--text3) !important;
    border-color:var(--border) !important;
    background:var(--bg2) !important;
    cursor:not-allowed !important;
    pointer-events:none;
  }

  /* Апгрейдер */
  .upgrade-stage {
    flex:1; display:flex; flex-direction:column;
    padding:12px 20px 16px;
    gap:8px; position:relative; z-index:2;
    overflow:hidden;
  }

  .upgrade-pair { display:flex; flex-direction:column; gap:8px; }

  .upgrade-side {
    border:1px solid var(--border2); border-radius:10px;
    background:linear-gradient(180deg, var(--bg3), var(--bg2));
    padding:10px 12px;
    cursor:pointer;
    display:flex; align-items:center; gap:12px;
    transition:border-color .2s;
  }
  .upgrade-side:active { border-color:var(--accent); }

  .upgrade-side .thumb {
    width:80px; height:50px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--text3);
  }
  .upgrade-side .thumb svg,
  .upgrade-side .thumb img { width:100%; height:100%; object-fit:contain; }

  .upgrade-side .info { flex:1; min-width:0; }
  .upgrade-side .info .label {
    font-size:9px; color:var(--text3); letter-spacing:2px; text-transform:uppercase;
    margin-bottom:3px;
  }
  .upgrade-side .info .name {
    font-size:13px; color:var(--sand);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .upgrade-side .info .wear { font-size:10px; color:var(--text3); margin-top:2px; }
  .upgrade-side .price {
    font-size:13px; color:var(--gold2); font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }

  .upgrade-circle-wrap {
    position:relative; width:150px; height:150px;
    display:flex; align-items:center; justify-content:center;
    margin:4px auto;
  }
  .upgrade-circle {
    width:140px; height:140px; border-radius:50%;
    border:5px solid var(--border);
    background:conic-gradient(var(--gold2) var(--p, 0%), var(--border) 0%);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition:background .3s;
  }
  .upgrade-circle::before {
    content:""; position:absolute; inset:7px; border-radius:50%;
    background:var(--bg2); z-index:1;
  }
  .upgrade-percent {
    position:relative; z-index:2;
    font-size:32px; font-weight:200; color:var(--gold2);
    font-variant-numeric:tabular-nums;
  }
  .upgrade-percent span { font-size:18px; }

  /* Треугольник, смотрящий ВНИЗ */
  .upgrade-arrow-indicator {
    position:absolute; top:-8px; left:50%;
    transform:translateX(-50%) rotate(0deg);
    transform-origin:50% 83px;
    z-index:5;
    filter:drop-shadow(0 0 6px var(--gold2));
    transition:transform 2.8s cubic-bezier(0.15, 0.7, 0.15, 1);
  }
  .upgrade-arrow-indicator svg { width:22px; height:26px; }

  .upgrade-chance {
    text-align:center; font-size:11px; color:var(--text3);
    letter-spacing:2px;
  }
  .upgrade-chance span { color:var(--accent); font-weight:600; }

  .upgrade-controls { margin-top:auto; padding-top:8px; }

  /* Модальное окно */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.85);
    z-index:200; display:none; align-items:flex-end;
  }
  .modal-overlay.show { display:flex; }
  .modal-sheet {
    width:100%; max-height:75vh; overflow-y:auto;
    background:var(--bg2); border-top:1px solid var(--border2);
    border-radius:20px 20px 0 0; padding:20px;
  }
  .modal-sheet h3 {
    font-size:14px; color:var(--sand); letter-spacing:2px;
    text-transform:uppercase; margin-bottom:14px; text-align:center;
  }
  .modal-item {
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border:1px solid var(--border);
    border-radius:8px; margin-bottom:8px; cursor:pointer;
    background:var(--bg);
  }
  .modal-item:active { border-color:var(--accent); }
  .modal-item .mi-img {
    width:60px; height:40px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-item .mi-img svg,
  .modal-item .mi-img img { width:100%; height:100%; object-fit:contain; }
  .modal-item .mi-info { flex:1; min-width:0; }
  .modal-item .mi-name { font-size:12px; color:var(--sand); }
  .modal-item .mi-wear { font-size:10px; color:var(--text3); margin-top:2px; }
  .modal-item .mi-price { font-size:12px; color:var(--gold2); flex-shrink:0; }
  .modal-empty { text-align:center; color:var(--text3); padding:30px 0; font-size:13px; }

  /* Инвентарь */
  .inv-list { flex:1; padding:16px 20px; overflow-y:auto; position:relative; z-index:2; }
  .inv-item {
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border:1px solid var(--border);
    border-radius:10px; margin-bottom:8px; background:var(--bg2);
  }
  .inv-item .inv-img {
    width:70px; height:44px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .inv-item .inv-img svg,
  .inv-item .inv-img img { width:100%; height:100%; object-fit:contain; }
  .inv-item .inv-info { flex:1; min-width:0; }
  .inv-item .inv-name { font-size:12px; color:var(--sand); }
  .inv-item .inv-wear { font-size:10px; color:var(--text3); margin-top:2px; }
  .inv-item .inv-stattrak { font-size:10px; color:var(--r-stattrak); margin-top:2px; }
  .inv-item .inv-price { font-size:12px; color:var(--gold2); flex-shrink:0; }
  .inv-empty { text-align:center; color:var(--text3); padding:50px 20px; font-size:13px; }

  #toast {
    position:fixed; top:50px; left:50%;
    transform:translateX(-50%) translateY(-30px);
    background:var(--bg2); color:var(--sand);
    padding:12px 20px; border-radius:100px;
    font-size:13px; z-index:100;
    border:1px solid var(--accent);
    transition:transform .3s, opacity .3s;
    pointer-events:none; white-space:nowrap; opacity:0;
  }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>

<div id="bg"></div>
<div class="decor-crates">
  <div class="crate"></div>
  <div class="crate small"></div>
  <div class="crate"></div>
  <div class="crate small"></div>
  <div class="crate"></div>
</div>

<!-- МЕНЮ -->
<div class="screen" id="menu">
  <div class="brand">C<span>S</span>2 · DUST 2</div>
  <div class="balance-block">
    <div class="balance-label">Баланс</div>
    <div class="balance-value" id="menuBalance">
      <span class="ico" data-icon="ruble"></span>
      <span class="num">0</span>
    </div>
  </div>

  <div class="modes">
    <button class="mode-btn" onclick="openMode('cases')">
      <div><div class="label">Кейсы</div><div class="sub">Открой контейнер</div></div>
      <div class="arrow">→</div>
    </button>
    <button class="mode-btn" onclick="openMode('upgrade')">
      <div><div class="label">Апгрейдер</div><div class="sub">Обменяй скины</div></div>
      <div class="arrow">→</div>
    </button>
    <button class="mode-btn" onclick="openMode('inventory')">
      <div><div class="label">Инвентарь</div><div class="sub">Мои скины</div></div>
      <div class="arrow">→</div>
    </button>
  </div>

  <div class="menu-footer">
    <button class="mini-btn" onclick="openProfile()">Профиль</button>
  </div>
</div>

<!-- КЕЙСЫ -->
<div class="screen hidden" id="cases">
  <div class="topbar">
    <button class="close-btn" onclick="backToMenu()"><span class="ico" data-icon="close"></span></button>
    <div class="topbar-balance"><span class="ico" data-icon="ruble"></span><span id="casesBalance">0</span></div>
  </div>
  <div class="cases-list" id="casesList"></div>
</div>

<!-- ОТКРЫТИЕ КЕЙСА -->
<div class="screen hidden" id="caseOpen">
  <div class="topbar">
    <button class="close-btn" onclick="closeCase()"><span class="ico" data-icon="close"></span></button>
    <div class="topbar-balance"><span class="ico" data-icon="ruble"></span><span id="openBalance">0</span></div>
  </div>
  <div class="roulette-stage">
    <div class="roulette">
      <div class="track" id="track"></div>
      <div class="pointer"></div>
    </div>
    <div class="spin-result" id="spinResult">
      <div class="label">Выпало</div>
      <div class="val" id="spinValue"></div>
    </div>
  </div>
  <div class="spin-controls">
    <button class="main-btn" id="spinBtn" onclick="mainCaseAction()">Открыть</button>
  </div>
</div>

<!-- АПГРЕЙДЕР -->
<div class="screen hidden" id="upgrade">
  <div class="topbar">
    <button class="close-btn" onclick="backToMenu()"><span class="ico" data-icon="close"></span></button>
    <div class="topbar-balance"><span class="ico" data-icon="ruble"></span><span id="upgradeBalance">0</span></div>
  </div>
  <div class="upgrade-stage">
    <div class="upgrade-pair">
      <div class="upgrade-side" id="upgradeFrom" onclick="pickFromInventory()">
        <div class="thumb" id="upFromPreview"></div>
        <div class="info">
          <div class="label">Твой скин</div>
          <div class="name" id="upFromName">Выбрать из инвентаря</div>
          <div class="wear" id="upFromWear">—</div>
        </div>
        <div class="price" id="upFromPrice">0 ₽</div>
      </div>
      <div class="upgrade-side" id="upgradeTo" onclick="pickToTarget()">
        <div class="thumb" id="upToPreview"></div>
        <div class="info">
          <div class="label">Целевой скин</div>
          <div class="name" id="upToName">Нажми, чтобы выбрать</div>
          <div class="wear" id="upToWear">—</div>
        </div>
        <div class="price" id="upToPrice">0 ₽</div>
      </div>
    </div>
    <div class="upgrade-circle-wrap">
      <div class="upgrade-arrow-indicator" id="upgradeArrow">
        <svg viewBox="0 0 22 26" fill="none">
          <path d="M3 4 L19 4 L11 22 Z" fill="#ffd966" stroke="#ffd966" stroke-width="1" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="upgrade-circle" id="upgradeCircle" style="--p: 0%;">
        <div class="upgrade-percent" id="upgradePercent">?%</div>
      </div>

/* ==================== ИЗНОС ==================== */
const WEARS = [
  { key:'FN', name:'Прямо с завода',        range:[0.00, 0.07], mult:1.00 },
  { key:'MW', name:'Немного поношенное',     range:[0.07, 0.15], mult:0.65 },
  { key:'FT', name:'После полевых испытаний', range:[0.15, 0.38], mult:0.40 },
  { key:'WW', name:'Поношенное',             range:[0.38, 0.45], mult:0.30 },
  { key:'BS', name:'Закалённое в боях',      range:[0.45, 1.00], mult:0.22 },
];

function randomWear() {
  const r = Math.random();
  if (r < 0.03) return WEARS[0];
  if (r < 0.10) return WEARS[1];
  if (r < 0.45) return WEARS[2];
  if (r < 0.55) return WEARS[3];
  return WEARS[4];
}

function createSkinInstance(skinDef) {
  const wear = randomWear();
  const statTrak = skinDef.hasStatTrak && Math.random() < 0.10;
  let price = Math.round(skinDef.basePrice * wear.mult);
  if (statTrak) price = Math.round(price * 1.35);
  return {
    id: skinDef.id + '_' + wear.key + (statTrak ? '_st' : '') + '_' + Date.now() + '_' + Math.random(),
    skinId: skinDef.id,
    name: skinDef.name,
    weapon: skinDef.weapon,
    rarity: skinDef.rarity,
    wear: wear.key,
    wearName: wear.name,
    statTrak: statTrak,
    price: price,
  };
}

/* ==================== РЕДКОСТИ ==================== */
const RARITY_WEIGHTS = {
  consumer:   50,
  industrial: 25,
  milspec:    15,
  restricted: 7,
  classified: 2,
  covert:     0.8,
  rare:       0.15,
  contraband: 0.02,
};

function pickSkinFromPool(pool) {
  const available = {};
  pool.forEach(s => { available[s.rarity] = (available[s.rarity] || 0) + 1; });
  let total = 0;
  const weighted = {};
  for (const r in RARITY_WEIGHTS) {
    if (available[r]) {
      weighted[r] = RARITY_WEIGHTS[r];
      total += RARITY_WEIGHTS[r];
    }
  }
  let roll = Math.random() * total;
  for (const r in weighted) {
    roll -= weighted[r];
    if (roll <= 0) {
      const poolOfRarity = pool.filter(s => s.rarity === r);
      return poolOfRarity[Math.floor(Math.random() * poolOfRarity.length)];
    }
  }
  return pool[0];
}

  else if (mode === 'upgrade') { showScreen('upgrade'); updateUpgradeChance(); }
  else if (mode === 'inventory') { showScreen('inventory'); renderInventory(); }

function openCaseScreen(caseKey) {
  state.currentCase = caseKey;
  showScreen('caseOpen');
  updateBalance();
  $('spinBtn').textContent = 'Открыть';
  $('spinBtn').disabled = false;
  $('spinBtn').classList.remove('disabled');
  $('spinResult').className = 'spin-result';
  fillTrack();
}

function fillTrack() {
  const track = $('track');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  const pool = getPoolForCurrentCase();
  for (let i = 0; i < 60; i++) {
    const skinDef = pool[Math.floor(Math.random() * pool.length)];
    track.appendChild(makeSlot(skinDef));
  }
}

function getPoolForCurrentCase() {
  if (state.currentCase === 'subcase') {
    return ALL_SKINS.filter(s => ['consumer', 'industrial', 'milspec'].includes(s.rarity));
  }
  const caseDef = CASES[state.currentCase];
  return ALL_SKINS.filter(s => caseDef.pool.includes(s.id));
}

function makeSlot(skinDef) {
  const el = document.createElement('div');
  el.className = 'slot ' + skinDef.rarity;
  el.innerHTML = `
    <div class="slot-img">${weaponImg(skinDef.weapon)}</div>
    <div class="slot-name">${skinDef.name.split('|')[0].trim()}</div>
    <div class="slot-wear">${skinDef.name.split('|')[1]?.trim() || ''}</div>
  `;
  return el;
}

function mainCaseAction() {
  if (state.isSpinning) return;
  state.isSpinning = true;

  const btn = $('spinBtn');
  btn.disabled = true;
  btn.classList.add('disabled');
  btn.textContent = 'Крутим...';
  $('spinResult').className = 'spin-result';

  const track = $('track');
  const pool = getPoolForCurrentCase();
  const winSkinDef = pickSkinFromPool(pool);
  const winSkin = createSkinInstance(winSkinDef);

  track.innerHTML = '';
  const STOP_INDEX = 50;
  for (let i = 0; i < 60; i++) {
    let skinDef;
    if (i === STOP_INDEX) skinDef = winSkinDef;
    else skinDef = pool[Math.floor(Math.random() * pool.length)];
    track.appendChild(makeSlot(skinDef));
  }

  void track.offsetWidth;

  const wrap = track.parentElement;
  const wrapW = wrap.clientWidth;
  const targetSlot = track.children[STOP_INDEX];
  const trackRect = track.getBoundingClientRect();
  const slotRect = targetSlot.getBoundingClientRect();
  const slotCenter = (slotRect.left - trackRect.left) + slotRect.width / 2;
  const targetX = wrapW / 2 - slotCenter;

  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  void track.offsetWidth;

  const duration = 4500;
  track.style.transition = `transform ${duration}ms cubic-bezier(0.12, 0.85, 0.18, 1)`;
  track.style.transform = `translateX(${targetX}px)`;

  setTimeout(() => {
    state.isSpinning = false;
    btn.disabled = false;
    btn.classList.remove('disabled');
    btn.textContent = 'Ещё раз';
    $('spinValue').innerHTML = `${rubIco()} ${winSkin.price}`;
    $('spinResult').className = 'spin-result show';

    state.inventory.push(winSkin);
    toastText(`${winSkin.name} (${winSkin.wear}${winSkin.statTrak ? ' ST' : ''})`);
    updateBalance();
  }, duration + 100);
}

      <div class="mi-img">${weaponImg(skin.weapon)}</div>
      <div class="mi-info">

        <div class="mi-wear">${skin.wearName}${skin.statTrak ? ' · StatTrak™' : ''}</div>
      </div>
      <div class="mi-price">${fmt(skin.price)} ₽</div>
    `;
    item.onclick = () => {
      state.upgrade.fromSkin = skin;
      $('upFromPreview').innerHTML = weaponImg(skin.weapon);
      $('upFromName').textContent = skin.name;
      $('upFromWear').textContent = skin.wearName + (skin.statTrak ? ' · ST' : '');
      $('upFromPrice').textContent = skin.price + ' ₽';
      if (state.upgrade.toSkin && state.upgrade.toSkin.price <= skin.price) {
        state.upgrade.toSkin = null;
        $('upToPreview').innerHTML = '';
        $('upToName').textContent = 'Нажми, чтобы выбрать';
        $('upToWear').textContent = '—';
        $('upToPrice').textContent = '0 ₽';
      }
      updateUpgradeChance();
      closeModal();
    };
    list.appendChild(item);
  });

  $('modalOverlay').classList.add('show');
}

function pickToTarget() {
  const from = state.upgrade.fromSkin;
  if (!from) {
    toastText('Сначала выбери свой скин');
    return;
  }

  const candidates = ALL_SKINS.filter(s => s.basePrice > from.price);

  if (!candidates.length) {
    toastText('Нет скинов дороже твоего');
    return;
  }

  const list = $('modalList');
  list.innerHTML = '';
  $('modalTitle').textContent = 'Выбери целевой скин';

  candidates.slice(0, 100).forEach(skinDef => {
    const item = document.createElement('div');
    item.className = 'modal-item';
    item.innerHTML = `
      <div class="mi-img">${weaponImg(skinDef.weapon)}</div>
      <div class="mi-info">
        <div class="mi-name">${skinDef.name}</div>
        <div class="mi-wear">от ${fmt(skinDef.basePrice)} ₽</div>
      </div>
      <div class="mi-price">${skinDef.rarity}</div>
    `;
    item.onclick = () => {
      const instance = createSkinInstance(skinDef);
      state.upgrade.toSkin = instance;
      $('upToPreview').innerHTML = weaponImg(instance.weapon);
      $('upToName').textContent = instance.name;
      $('upToWear').textContent = instance.wearName;
      $('upToPrice').textContent = instance.price + ' ₽';
      updateUpgradeChance();
      closeModal();
    };
    list.appendChild(item);
  });

  $('modalOverlay').classList.add('show');
}

function closeModal(e) {
  if (e && e.target !== $('modalOverlay')) return;
  $('modalOverlay').classList.remove('show');
}

function updateUpgradeChance() {
  const from = state.upgrade.fromSkin;
  const to = state.upgrade.toSkin;

  if (!from || !to) {
    state.upgrade.chance = 0;
    $('upChance').textContent = '0%';
    $('upgradePercent').textContent = '?%';
    $('upgradeCircle').style.setProperty('--p', '0%');
    return;
  }

  let chance = (from.price / to.price) * 100;
  chance = Math.min(chance, 90);
  chance = Math.max(chance, 1);
  state.upgrade.chance = Math.round(chance);

  $('upChance').textContent = state.upgrade.chance + '%';
  $('upgradePercent').innerHTML = state.upgrade.chance + '<span>%</span>';
  $('upgradeCircle').style.setProperty('--p', state.upgrade.chance + '%');
}

function doUpgrade() {
  if (!state.upgrade.fromSkin || !state.upgrade.toSkin) {
    toastText('Выбери оба скина');
    return;
  }
  if (state.isSpinning) return;
  state.isSpinning = true;

  const btn = $('upgradeBtn');
  btn.disabled = true;
  btn.classList.add('disabled');
  btn.textContent = 'Крутим...';

  const arrow = $('upgradeArrow');
  const success = Math.random() * 100 < state.upgrade.chance;
  const chance = state.upgrade.chance;

  let finalAngle;
  const extraSpins = 3;

  if (success) {
    const zoneEnd = (chance / 100) * 360;
    finalAngle = 360 * extraSpins + Math.random() * zoneEnd * 0.9;
  } else {
    const zoneEnd = (chance / 100) * 360;
    const mode = Math.random() < 0.5 ? 'over' : 'under';
    if (mode === 'over') {
      finalAngle = 360 * extraSpins + zoneEnd + 5 + Math.random() * 40;
    } else {
      finalAngle = 360 * (extraSpins - 1) + 360 - (2 + Math.random() * 8);
    }
  }

  arrow.style.transition = 'none';
  arrow.style.transform = `translateX(-50%) rotate(0deg)`;
  void arrow.offsetWidth;

  arrow.style.transition = `transform 2.8s cubic-bezier(0.15, 0.7, 0.15, 1)`;
  arrow.style.transform = `translateX(-50%) rotate(${finalAngle}deg)`;

  setTimeout(() => {
    state.isSpinning = false;
    btn.disabled = false;
    btn.classList.remove('disabled');
    btn.textContent = 'Прокачать';

    if (success) {
      const idx = state.inventory.findIndex(s => s.id === state.upgrade.fromSkin.id);
      if (idx >= 0) state.inventory.splice(idx, 1);
      state.inventory.push(state.upgrade.toSkin);
      toastText('Успех! Получен: ' + state.upgrade.toSkin.name);

      state.upgrade.fromSkin = null;
      state.upgrade.toSkin = null;
      $('upFromPreview').innerHTML = '';
      $('upFromName').textContent = 'Выбрать из инвентаря';
      $('upFromWear').textContent = '—';
      $('upFromPrice').textContent = '0 ₽';
      $('upToPreview').innerHTML = '';
      $('upToName').textContent = 'Нажми, чтобы выбрать';
      $('upToWear').textContent = '—';
      $('upToPrice').textContent = '0 ₽';
      updateUpgradeChance();
    } else {
      toastText('Провал...');
    }
    updateBalance();
  }, 2900);
}

/* ==================== ИНВЕНТАРЬ ==================== */
function renderInventory() {
  const list = $('invList');
  if (!state.inventory.length) {
    list.innerHTML = '<div class="inv-empty">Инвентарь пуст.<br>Открой кейс, чтобы получить скины.</div>';
    return;
  }
  list.innerHTML = '';
  state.inventory.forEach(skin => {
    const el = document.createElement('div');
    el.className = 'inv-item';
    el.innerHTML = `
      <div class="inv-img">${weaponImg(skin.weapon)}</div>
      <div class="inv-info">
        <div class="inv-name">${skin.name}</div>
        <div class="inv-wear">${skin.wearName}</div>
        ${skin.statTrak ? '<div class="inv-stattrak">StatTrak™</div>' : ''}
      </div>
      <div class="inv-price">${fmt(skin.price)} ₽</div>
    `;
    list.appendChild(el);
  });
}

/* ==================== INIT ==================== */
renderIcons();
updateBalance();
</script>
</body>
</html>
